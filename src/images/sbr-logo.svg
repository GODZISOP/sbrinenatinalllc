<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="sbrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D3B066" />
      <stop offset="50%" stop-color="#8b7224" />
      <stop offset="100%" stop-color="#3d3210" />
    </linearGradient>
    <linearGradient id="sbrNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243354" />
      <stop offset="100%" stop-color="#0d141a" />
    </linearGradient>
    <linearGradient id="sbrGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#8b7224" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#D3B066" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b7224" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Crest Hexagon / Shield Backdrop -->
  <g transform="translate(210, 95)">
    <!-- Outer Crest -->
    <path d="M 0 -72 L 68 -36 L 68 36 L 0 72 L -68 36 L -68 -36 Z" 
          stroke="url(#sbrGold)" stroke-width="3" fill="#17223A" />
    
    <!-- Inner Accent Crest -->
    <path d="M 0 -62 L 58 -31 L 58 31 L 0 62 L -58 31 L -58 -31 Z" 
          stroke="url(#sbrGold)" stroke-width="1.2" stroke-dasharray="4 3" fill="none" opacity="0.6" />

    <!-- Center Monogram SBR -->
    <text x="0" y="16" text-anchor="middle" font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="34" font-weight="900" fill="url(#sbrGold)" letter-spacing="4">
      SBR
    </text>

    <!-- Star / Quality Crown Icon -->
    <path d="M 0 -48 L 4 -38 L 14 -38 L 6 -32 L 9 -22 L 0 -28 L -9 -22 L -6 -32 L -14 -38 L -4 -38 Z" 
          fill="#D3B066" />
  </g>

  <!-- Dynamic Golden Wings/Ribbon -->
  <path d="M 90 95 C 130 95, 140 115, 125 130 C 110 145, 95 125, 60 110 C 75 102, 85 98, 90 95 Z" fill="url(#sbrGold)" opacity="0.85" />
  <path d="M 330 95 C 290 95, 280 115, 295 130 C 310 145, 325 125, 360 110 C 345 102, 335 98, 330 95 Z" fill="url(#sbrGold)" opacity="0.85" />

  <!-- Brand Typography: SBR INTERNATIONALS -->
  <text x="210" y="215" text-anchor="middle" font-family="'Montserrat', 'Playfair Display', serif" font-size="24" font-weight="800" fill="#17223A" letter-spacing="3">
    SBR INTERNATIONALS
  </text>

  <!-- Subtitle: — LLC • QUALITY FOR LIFE — -->
  <g transform="translate(210, 246)">
    <line x1="-120" y1="-5" x2="-65" y2="-5" stroke="#8b7224" stroke-width="1.8" stroke-linecap="round"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8b7224" letter-spacing="3.5">
      LLC • QUALITY FOR LIFE
    </text>
    <line x1="65" y1="-5" x2="120" y2="-5" stroke="#8b7224" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
